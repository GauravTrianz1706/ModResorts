version: '3.8'

services:
  modresorts:
    build:
      context: .
      dockerfile: Dockerfile
    image: modresorts:latest
    container_name: modresorts-app
    ports:
      - "8080:8080"
    environment:
      # Application configuration
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport
      - TZ=UTC
      
      # External service connections (configure as needed)
      # Database connection (if required)
      # - DB_HOST=your-database-host
      # - DB_PORT=5432
      # - DB_NAME=modresorts
      # - DB_USER=dbuser
      # - DB_PASSWORD=dbpassword
      
      # Redis cache connection (if required)
      # - REDIS_HOST=your-redis-host
      # - REDIS_PORT=6379
      # - REDIS_PASSWORD=redispassword
      
      # External API endpoints (if required)
      # - WEATHER_API_URL=https://api.weather.com
      # - WEATHER_API_KEY=your-api-key
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge
