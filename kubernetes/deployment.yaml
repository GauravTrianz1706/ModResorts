apiVersion: apps/v1
kind: Deployment
metadata:
  name: modresorts
  namespace: modresorts
  labels:
    app: modresorts
    version: "2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modresorts
  template:
    metadata:
      labels:
        app: modresorts
        version: "2.0.0"
    spec:
      containers:
        - name: modresorts
          image: {{IMAGE_URI}}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9080
              protocol: TCP
          env:
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
            - name: WEATHER_API_KEY
              value: "{{WEATHER_API_KEY}}"
            - name: JNDI_FACTORY
              value: "{{JNDI_FACTORY}}"
            - name: JNDI_PROVIDER_URL
              value: "{{JNDI_PROVIDER_URL}}"
            - name: SERVER_DISPLAY_NAME
              value: "{{SERVER_DISPLAY_NAME}}"
            - name: SERVER_FULL_NAME
              value: "{{SERVER_FULL_NAME}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /resorts/health
              port: 9080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /resorts/health
              port: 9080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
