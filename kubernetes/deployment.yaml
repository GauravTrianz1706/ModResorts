apiVersion: apps/v1
kind: Deployment
metadata:
  name: modresorts
  namespace: modresorts
  labels:
    app: modresorts
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modresorts
  template:
    metadata:
      labels:
        app: modresorts
        version: v1
    spec:
      containers:
      - name: modresorts
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: SERVER_NAME
          value: "modresorts-eks"
        - name: SERVER_FULL_NAME
          value: "modresorts-eks-instance"
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        - name: DB_URL
          value: "{{DB_URL}}"
        - name: DB_USERNAME
          value: "{{DB_USERNAME}}"
        - name: DB_PASSWORD
          value: "{{DB_PASSWORD}}"
        - name: DB_DRIVER
          value: "{{DB_DRIVER}}"
        - name: REDIS_HOST
          value: "{{REDIS_HOST}}"
        - name: REDIS_PORT
          value: "{{REDIS_PORT}}"
        - name: REDIS_PASSWORD
          value: "{{REDIS_PASSWORD}}"
        - name: REDIS_TIMEOUT
          value: "{{REDIS_TIMEOUT}}"
        - name: SERVICE_REGISTRY_URL
          value: "{{SERVICE_REGISTRY_URL}}"
        - name: AWS_CLOUDMAP_NAMESPACE
          value: "{{AWS_CLOUDMAP_NAMESPACE}}"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
