# Spring Boot Application Configuration for Azure Cloud Deployment
# This file contains cloud-native configuration for ModResorts application

# Application Settings
spring.application.name=modresorts
server.port=${PORT:8080}

# Logging Configuration
logging.level.root=INFO
logging.level.com.acme.modres=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Azure SQL Database Configuration
# Connection string should be configured in Azure App Service Application Settings
# For production: Use Azure Key Vault references
spring.datasource.url=${AZURE_SQL_CONNECTION_STRING:jdbc:sqlserver://localhost:1433;database=modresorts}
spring.datasource.username=${AZURE_SQL_USERNAME:sa}
spring.datasource.password=${AZURE_SQL_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Connection Pool Configuration (Cloud-optimized)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Azure Key Vault Configuration
# Enable Azure Key Vault integration for secrets management
azure.keyvault.enabled=${AZURE_KEYVAULT_ENABLED:false}
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}
azure.keyvault.tenant-id=${AZURE_TENANT_ID:}

# Azure Blob Storage Configuration
# For file storage operations (replacing local file system)
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}
azure.storage.account-key=${AZURE_STORAGE_ACCOUNT_KEY:}
azure.storage.blob-endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:modresorts-data}

# Azure Application Insights Configuration
# For monitoring and telemetry
azure.application-insights.instrumentation-key=${APPINSIGHTS_INSTRUMENTATIONKEY:}

# Weather API Configuration
# API key should be stored in Azure Key Vault
weather.api.key=${WEATHER_API_KEY:}

# Timezone Configuration (UTC for cloud consistency)
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator Endpoints for Health Checks (Azure App Service)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Servlet Configuration
server.servlet.context-path=/
server.servlet.session.timeout=30m

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
