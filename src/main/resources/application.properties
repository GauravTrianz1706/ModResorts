# Spring Boot Application Configuration for Containerized Deployment
spring.application.name=modresorts

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Actuator Configuration (Health Check Endpoint)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
management.metrics.export.prometheus.enabled=true

# Database Configuration (externalized via environment variables)
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Redis Configuration for Distributed Caching (Amazon ElastiCache)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Logging Configuration
logging.level.root=INFO
logging.level.com.acme.modres=DEBUG

# Service Discovery Configuration (AWS Cloud Map)
service.registry.url=${SERVICE_REGISTRY_URL:http://localhost:8080}
aws.cloudmap.namespace=${AWS_CLOUDMAP_NAMESPACE:}

# Environment Configuration
server.name=${SERVER_NAME:modresorts-container}
server.full.name=${SERVER_FULL_NAME:modresorts-container-instance}
