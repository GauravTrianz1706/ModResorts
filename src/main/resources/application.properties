# Spring Boot Application Configuration for AWS Cloud Deployment

# Application Name
spring.application.name=modresorts

# Server Configuration (externalized via environment variables)
server.port=${SERVER_PORT:8080}

# AWS Region Configuration
aws.region=${AWS_REGION:us-east-1}

# S3 Configuration
s3.bucket.name=${S3_BUCKET_NAME:modresorts-data}

# Database Configuration with HikariCP Connection Pooling
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/modresorts}
spring.datasource.username=${DB_USERNAME:modresorts}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Session Configuration for Amazon ElastiCache
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.redis.namespace=modresorts:session

# Logging Configuration (JSON format for cloud monitoring)
logging.level.root=INFO
logging.level.com.acme.modres=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration for Health Checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Timezone Configuration (UTC standardized)
spring.jackson.time-zone=UTC
