# Spring Boot Application Configuration for AWS Cloud Deployment

# Application name
spring.application.name=modresorts

# Server configuration - use environment variable for port
server.port=${PORT:8080}

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${S3_BUCKET_NAME:modresorts-data}
aws.secrets.weather-api=${WEATHER_API_SECRET_NAME:modresorts/weather-api}

# Database Configuration with HikariCP Connection Pooling
# Use environment variables for cloud deployment
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/modresorts}
spring.datasource.username=${DATABASE_USERNAME:modresorts}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration - JSON format for cloud monitoring
logging.level.root=INFO
logging.level.com.acme.modres=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator endpoints for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Servlet configuration
spring.mvc.servlet.path=/
