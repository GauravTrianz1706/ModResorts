# Spring Boot Application Configuration for Cloud Deployment
spring.application.name=modresorts

# Server Configuration (externalized via environment variables)
server.port=${PORT:8080}

# Database Configuration (Cloud SQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/modresorts}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration (GCP Memorystore)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2

# Spring Session Configuration
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=modresorts:session

# Logging Configuration (structured for cloud monitoring)
logging.level.root=INFO
logging.level.com.acme.modres=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Google Cloud Configuration
gcp.project.id=${GCP_PROJECT_ID:}
gcp.storage.bucket=${GCS_BUCKET_NAME:modresorts-config}
gcp.secret.weather-api-key=${WEATHER_API_KEY_SECRET_NAME:weather-api-key}

# Actuator Configuration for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=true
management.health.db.enabled=true

# Servlet Configuration
spring.mvc.servlet.path=/
server.servlet.context-path=/
server.servlet.session.timeout=30m
